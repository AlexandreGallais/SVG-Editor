# Weekly dependency updates; each PR passes the full CI (docs/tooling/versions-and-security.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        exclude-patterns: ["typescript"]
    ignore:
      # TypeScript stays on 6.0.x until typescript-eslint supports 7 (ADR-0009).
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
